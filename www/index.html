<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Neo RCM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f766e; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .logo { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 40px; }
    .auth-btn { background: #fff; color: #0f766e; border: none; padding: 16px 48px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .auth-btn:active { transform: scale(0.97); }
    .auth-btn svg { width: 24px; height: 24px; }
    .skip { margin-top: 20px; background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 12px 32px; border-radius: 12px; font-size: 14px; cursor: pointer; }
    .offline-banner { display: none; position: fixed; top: 0; left: 0; right: 0; background: #ef4444; color: #fff; text-align: center; padding: 8px; font-size: 13px; z-index: 9999; }
    .offline-banner.show { display: block; }
    .loading { display: none; font-size: 14px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">No internet connection</div>
  <div id="authScreen">
    <div class="logo">Neo RCM</div>
    <div class="subtitle">Revenue Cycle Management Portal</div>
    <button class="auth-btn" id="biometricBtn" onclick="authenticate()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 11c0-1.1.9-2 2-2s2 .9 2 2-2 4-2 4"/><path d="M8 11a4 4 0 0 1 8 0"/><path d="M6 11a6 6 0 0 1 12 0"/><path d="M12 11v4"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
      Unlock with Biometrics
    </button>
    <button class="skip" onclick="skipAuth()">Sign in with Password</button>
    <div class="loading" id="loading">Loading portal...</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
